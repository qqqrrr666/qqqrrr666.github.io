<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>勇敢的小勇者 · 打怪升级小游戏</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(circle at 50% 30%, #2b2340, #171232 70%);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; user-select: none;
    font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
  }
  #wrap { position: relative; line-height: 0; }
  canvas {
    display: block;
    border-radius: 18px;
    box-shadow: 0 18px 60px rgba(0,0,0,0.55), 0 0 0 6px rgba(255,255,255,0.08);
  }
  #hint {
    position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%);
    color: rgba(255,255,255,0.38); font-size: 13px; letter-spacing: 1px;
    pointer-events: none; user-select: none;
  }
</style>
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="1280" height="720"></canvas>
  </div>
  <div id="hint">提示：WASD 移动 · 鼠标瞄准 · 按住左键蓄力松开释放冲击波 · Q/E/R/空格 使用技能</div>
  <script>
/* ============================================================================
 *  engine.js —— 《勇敢的小勇者》浏览器引擎
 *  --------------------------------------------------------------------------
 *  本文件与 src/game.cpp 为“同构移植”：常量、结构、算法、数值一一对应。
 *  若希望网页直接运行 C++ 版本，可用 Emscripten 将 game.cpp 编译为 WASM，
 *  再接入同一渲染层 render.js（接入方式见 README.md）。
 * ==========================================================================*/

"use strict";

const GW = (function () {

  // ---- 基础常量（与 C++ 严格一致） ----
  const GW_W = 1280, GW_H = 720, GW_PR = 22;
  const MAX_MONSTERS = 96, MAX_BULLETS = 64, MAX_WAVES = 12,
        MAX_PARTS = 240, MAX_TEXTS = 32, MAX_ORBS = 128;

  const MT_SLIME_G = 0, MT_SLIME_B = 1, MT_SLIME_R = 2, MT_BOAR = 3, MT_COUNT = 4;
  const ST_MENU = 0, ST_PLAY = 1, ST_OVER = 2;
  const SK_FIREBALL = 0, SK_DASH = 1, SK_FROST = 2, SK_ROLL = 3, SK_COUNT = 4;
  const PRESS_ATK = 0, PRESS_FIREBALL = 1, PRESS_DASH = 2, PRESS_FROST = 3, PRESS_ROLL = 4;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

  /* ------------------------ 实体工厂 ------------------------ */

  function makePlayer() {
    return {
      x: 0, y: 0, fdx: 0, fdy: -1,
      hp: 0, maxHp: 0, atk: 0,
      cd: [0, 0, 0, 0], atkCd: 0,
      level: 1, exp: 0, expNext: 0, kills: 0,
      invul: 0, rollT: 0, rollDx: 0, rollDy: 0,
      chargeT: 0, charging: 0, dead: 0
    };
  }

  function makeMonster() {
    return { x: 0, y: 0, hp: 0, maxHp: 0, spd: 0, dmg: 0, r: 16,
             type: 0, alive: 0, atkCd: 0, hitCd: 0, slowT: 0,
             dashMark: 0, seed: 0, dir: -1 };
  }

  function makeBullet() {
    return { x: 0, y: 0, vx: 0, vy: 0, dmg: 0, r: 15, life: 0, pierce: 0, alive: 0 };
  }

  function makeWave() {
    return { x: 0, y: 0, dirX: 0, dirY: -1, arc: 1.5, radius: 0, maxRadius: 175,
             growSpeed: 720, life: 0, maxLife: 0.32, baseDmg: 0,
             punch: 0, knock: 14, alive: 0,
             hit: new Array(MAX_MONSTERS).fill(false) };
  }

  function makeParticle() {
    return { x: 0, y: 0, vx: 0, vy: 0, life: 0, maxLife: 1, size: 3,
             color: 0, kind: 0, alive: 0 };
  }

  function makeText() {
    return { x: 0, y: 0, vy: -34, life: 0, color: 0, size: 16, str: "", alive: 0 };
  }

  function makeOrb() {
    return { x: 0, y: 0, vx: 0, vy: 0, life: 0, value: 0, alive: 0 };
  }

  function makeGame() {
    const g = {
      p: makePlayer(),
      ms: [], bs: [], ws: [], ps: [], ts: [], os: [],
      state: ST_PLAY, time: 0, wave: 0, kills: 0, aliveMon: 0,
      spawnT: 0, spawnQueued: 0, wavePauseT: 0, shake: 0,
      dashSeq: 0, rng: 0, msgT: 0, msg: "",
      moveX: 0, moveY: 0, aimX: 0, aimY: -1,
      atkPressed: 0, skillPressed: [0, 0, 0, 0]
    };
    // C++ 中所有实体为“定长数组”，元素始终存在；
    // JS 数组需预填充固定数量，否则按 MAX_* 循环越界读到 undefined。
    for (let i = 0; i < MAX_MONSTERS; i++) g.ms.push(makeMonster());
    for (let i = 0; i < MAX_BULLETS; i++)  g.bs.push(makeBullet());
    for (let i = 0; i < MAX_WAVES; i++)    g.ws.push(makeWave());
    for (let i = 0; i < MAX_PARTS; i++)    g.ps.push(makeParticle());
    for (let i = 0; i < MAX_TEXTS; i++)    g.ts.push(makeText());
    for (let i = 0; i < MAX_ORBS; i++)     g.os.push(makeOrb());
    return g;
  }

  /* ------------------------ 随机数（xorshift32） ------------------------ */

  function rand() {
    let x = G.rng >>> 0;
    if (x === 0) x = 2463534242;
    x ^= x << 13; x >>>= 0;
    x ^= x >> 17; x >>>= 0;
    x ^= x << 5;  x >>>= 0;
    G.rng = x;
    return (x & 0xffffff) / 16777215;
  }

  function toUnit(x, y) {
    const d = Math.sqrt(x * x + y * y);
    if (d < 0.0001) return { x: 0, y: -1 };
    return { x: x / d, y: y / d };
  }

  /* ------------------------ 粒子 / 文字 ------------------------ */

  function addParticle(kind, x, y, vx, vy, life, size, color) {
    for (let i = 0; i < MAX_PARTS; i++) {
      const q = G.ps[i];
      if (q.alive) continue;
      q.alive = 1; q.kind = kind; q.color = color;
      q.x = x; q.y = y; q.vx = vx; q.vy = vy;
      q.life = q.maxLife = life; q.size = size;
      return;
    }
  }

  function addText(s, x, y, color, size) {
    for (let i = 0; i < MAX_TEXTS; i++) {
      const t = G.ts[i];
      if (t.alive) continue;
      t.alive = 1; t.color = color; t.size = size;
      t.x = x; t.y = y; t.vy = -34; t.life = 0.85; t.str = String(s);
      return;
    }
  }

  function setMsg(s) { G.msg = String(s); G.msgT = 2.0; }

  /* ------------------------ 经验球 ------------------------ */

  function dropOrb(x, y, value) {
    for (let i = 0; i < MAX_ORBS; i++) {
      const o = G.os[i];
      if (o.alive) continue;
      o.alive = 1; o.x = x; o.y = y;
      o.vx = (rand() - 0.5) * 120;
      o.vy = (rand() - 0.5) * 120;
      o.life = 8; o.value = value;
      return;
    }
  }

  /* ------------------------ 怪物 ------------------------ */

  const BASE_HP  = [26, 46, 70, 120];
  const BASE_SPD = [70, 105, 135, 150];
  const BASE_DMG = [8, 12, 16, 24];
  const BASE_R   = [16, 18, 20, 26];

  function spawnMonster(type, x, y) {
    for (let i = 0; i < MAX_MONSTERS; i++) {
      const m = G.ms[i];
      if (m.alive) continue;
      m.alive = 1; m.type = type; m.x = x; m.y = y;
      m.seed = rand() * 6.28;
      m.dir = -1; m.hitCd = 0; m.atkCd = 0; m.slowT = 0; m.dashMark = 0;

      let mult = 1 + 0.10 * (G.wave - 1);
      if (mult > 4) mult = 4;
      m.maxHp = BASE_HP[type] * mult;
      m.spd = BASE_SPD[type] * (0.85 + rand() * 0.3);
      m.dmg = BASE_DMG[type];
      m.r = BASE_R[type];
      m.hp = m.maxHp;
      G.aliveMon++;
      return;
    }
  }

  function spawnWaveMonster() {
    let type = MT_SLIME_G;
    const roll = rand();
    if (G.wave <= 1) type = MT_SLIME_G;
    else if (G.wave === 2) type = roll < 0.65 ? MT_SLIME_G : MT_SLIME_B;
    else if (G.wave === 3) type = roll < 0.45 ? MT_SLIME_G : (roll < 0.8 ? MT_SLIME_B : MT_SLIME_R);
    else {
      type = roll < 0.35 ? MT_SLIME_G
           : roll < 0.62 ? MT_SLIME_B
           : roll < 0.86 ? MT_SLIME_R
           : MT_BOAR;
    }
    const a = rand() * 6.2831853;
    const px = clamp(G.p.x + Math.cos(a) * 760, 40, GW_W - 40);
    const py = clamp(G.p.y + Math.sin(a) * 460, 40, GW_H - 40);
    spawnMonster(type, px, py);
  }

  function nextExpNeed(level) {
    return 60 + (level - 1) * 30 + (level - 1) * (level - 1) * 8;
  }

  function killMonster(i) {
    const m = G.ms[i];
    dropOrb(m.x, m.y, (G.wave + m.type) * 2 + 4);
    G.kills++;
    G.aliveMon--;
    for (let n = 0; n < 10; n++) {
      const a = rand() * 6.2831853;
      const sp = 60 + rand() * 200;
      addParticle(0, m.x, m.y, Math.cos(a) * sp, Math.sin(a) * sp,
                  0.5 + rand() * 0.3, 3 + rand() * 4, 5);
    }
    m.alive = 0;
  }

  /* ------------------------ 升级 ------------------------ */

  function addExp(amount) {
    const p = G.p;
    p.exp += amount;
    while (p.exp >= p.expNext) {
      p.exp -= p.expNext;
      p.level++;
      p.maxHp += 12;
      p.atk += 3;
      p.hp = p.maxHp;
      p.expNext = nextExpNeed(p.level);
      setMsg("升级! Lv." + p.level);
      for (let n = 0; n < 24; n++) {
        const a = n / 24 * 6.2831853;
        addParticle(1, p.x, p.y, Math.cos(a) * 150 + 60, Math.sin(a) * 150 + 60,
                    0.7, 4.5, 3);
      }
    }
  }

  /* ------------------------ 技能 ------------------------ */

  function castFireball() {
    const p = G.p;
    for (let i = 0; i < MAX_BULLETS; i++) {
      const b = G.bs[i];
      if (b.alive) continue;
      b.alive = 1; b.pierce = 2;
      b.dmg = 30 + p.atk * 0.8;
      b.r = 15; b.life = 1.3;
      b.x = p.x + p.fdx * 36; b.y = p.y + p.fdy * 36;
      b.vx = p.fdx * 540; b.vy = p.fdy * 540;
      return;
    }
  }

  function castDash() {
    const p = G.p;
    p.rollT = 0.30; p.invul = 0.35;
    p.rollDx = p.fdx; p.rollDy = p.fdy;
    p.cd[SK_DASH] = 3.4;
    G.dashSeq++;
    G.shake = Math.max(G.shake, 3.0);
    for (let n = 0; n < 8; n++) {
      const a = rand() * 6.2831853;
      addParticle(2, p.x, p.y, Math.cos(a) * 200 + 60, Math.sin(a) * 200 + 60,
                  0.3, 3.0, 2);
    }
  }

  function castFrost() {
    const p = G.p;
    const RANGE = 230;
    for (let i = 0; i < MAX_MONSTERS; i++) {
      const m = G.ms[i];
      if (!m.alive) continue;
      const dx = m.x - p.x, dy = m.y - p.y;
      const d = Math.sqrt(dx * dx + dy * dy);
      if (d < RANGE + m.r) {
        const dmg = 42 + p.atk * 1.1;
        m.hp -= dmg;
        m.slowT = 1.8; m.hitCd = 0.2;
        addText(Math.floor(dmg), m.x, m.y - m.r - 10, 4, 18);
        if (m.hp <= 0) { killMonster(i); continue; }
        if (d > 0.001) { m.x += (dx / d) * 46; m.y += (dy / d) * 46; }
      }
    }
    G.shake = Math.max(G.shake, 5.0);
    for (let n = 0; n < 26; n++) {
      const a = n / 26 * 6.2831853;
      addParticle(0, p.x, p.y, Math.cos(a) * 320 + 90, Math.sin(a) * 320 + 90,
                  0.5, 4.0, 4);
    }
  }

  function castRoll() {
    const p = G.p;
    p.rollT = 0.20; p.invul = 0.24;
    p.rollDx = p.fdx; p.rollDy = p.fdy;
  }

  /* ------------------------ 普攻（蓄力冲击波） ------------------------ */
  // 手感参考《元气骑士》气宗：按住蓄力，松开/蓄满向前轰出冲击波。
  // 轻点=快波；中蓄=标准波；蓄满=大范围高伤强击退。伤害随距离递减。

  function playerAttack(punch) {
    const p = G.p;
    let maxR, grow, arc, dmgMult, knock, life;
    if (punch < 0.35) {
      maxR = 130; grow = 780; arc = 1.35; dmgMult = 0.75; knock = 14; life = 0.22;
    } else if (punch < 0.8) {
      maxR = 185; grow = 840; arc = 1.5;  dmgMult = 1.0;  knock = 26; life = 0.30;
    } else {
      maxR = 255; grow = 1020; arc = 1.7; dmgMult = 1.7; knock = 46; life = 0.34;
    }
    for (let i = 0; i < MAX_WAVES; i++) {
      const w = G.ws[i];
      if (w.alive) continue;
      w.alive = 1;
      w.x = p.x; w.y = p.y;
      w.dirX = p.fdx; w.dirY = p.fdy;
      w.arc = arc;
      w.radius = 0; w.maxRadius = maxR; w.growSpeed = grow;
      w.life = w.maxLife = life;
      w.baseDmg = p.atk * dmgMult;
      w.punch = punch; w.knock = knock;
      for (let k = 0; k < MAX_MONSTERS; k++) w.hit[k] = false;
      break;
    }
    p.atkCd = 0.10 + 0.10 * punch;
  }

  function releaseCharge() {
    const p = G.p;
    if (!p.charging) return;
    p.charging = 0;
    const punch = p.chargeT;
    p.chargeT = 0;
    playerAttack(punch);
    if (punch >= 0.8) {
      G.shake = Math.max(G.shake, 8);
      for (let n = 0; n < 14; n++) {
        const a = n / 14 * 6.2831853;
        addParticle(0, p.x, p.y, Math.cos(a) * 300 + 80, Math.sin(a) * 300 + 80,
                    0.4, 4.0, (n % 2) ? 1 : 3);
      }
    } else if (punch >= 0.35) {
      G.shake = Math.max(G.shake, 3);
    }
  }

  function updateWaves(dt) {
    const BAND = 22;
    for (let i = 0; i < MAX_WAVES; i++) {
      const w = G.ws[i];
      if (!w.alive) continue;
      w.radius += w.growSpeed * dt;
      w.life -= dt;
      if (w.life <= 0 || w.radius >= w.maxRadius) { w.alive = 0; continue; }

      const cosArc = Math.cos(w.arc * 0.5);
      const t = w.radius / w.maxRadius;
      for (let j = 0; j < MAX_MONSTERS; j++) {
        const m = G.ms[j];
        if (!m.alive || w.hit[j]) continue;
        const dx = m.x - w.x, dy = m.y - w.y;
        const d = Math.sqrt(dx * dx + dy * dy);
        if (Math.abs(d - w.radius) > BAND + m.r) continue;
        if (d > 0.001) {
          const dot = (dx / d) * w.dirX + (dy / d) * w.dirY;
          if (dot < cosArc) continue;
        }
        const dmg = w.baseDmg * (1 - 0.55 * t) * (0.9 + rand() * 0.2);
        m.hp -= dmg;
        m.hitCd = 0.16;
        w.hit[j] = true;
        addText(Math.floor(dmg), m.x, m.y - m.r - 12, 0, 16);
        for (let n = 0; n < 4; n++) {
          const a = rand() * 6.2831853;
          addParticle(2, m.x, m.y, Math.cos(a) * 220 + 40, Math.sin(a) * 220 + 40,
                      0.25, 2.6, 1);
        }
        if (m.hp <= 0) { killMonster(j); continue; }
        if (d > 0.001) { m.x += (dx / d) * w.knock; m.y += (dy / d) * w.knock; }
      }
    }
  }

  /* ------------------------ 波次 ------------------------ */

  function startWave(n) {
    G.wave = n;
    G.spawnQueued = 4 + n * 2;
    G.spawnT = 0;
    setMsg("第 " + n + " 波来袭!");
  }

  /* ------------------------ 玩家更新 ------------------------ */

  function updatePlayer(dt) {
    const p = G.p;
    const al = G.aimX * G.aimX + G.aimY * G.aimY;
    if (al > 0.0001) {
      const u = toUnit(G.aimX, G.aimY);
      p.fdx = u.x; p.fdy = u.y;
    }
    const mv = G.moveX * G.moveX + G.moveY * G.moveY;

    if (p.rollT > 0) {
      p.rollT -= dt;
      p.x += p.rollDx * 860 * dt;
      p.y += p.rollDy * 860 * dt;
      for (let i = 0; i < MAX_MONSTERS; i++) {
        const m = G.ms[i];
        if (!m.alive || m.dashMark === G.dashSeq) continue;
        const dx = m.x - p.x, dy = m.y - p.y;
        const d = Math.sqrt(dx * dx + dy * dy);
        if (d > 46 + m.r) continue;
        const dmg = 20 + p.atk * 0.9;
        m.hp -= dmg; m.dashMark = G.dashSeq; m.hitCd = 0.15;
        G.shake = Math.max(G.shake, 2.5);
        addText(Math.floor(dmg), m.x, m.y - m.r - 12, 0, 16);
        if (m.hp <= 0) killMonster(i);
      }
    } else if (mv > 0.0001) {
      const n = Math.sqrt(mv);
      const spd = p.charging ? 150 : 260;
      const vx = G.moveX / n * spd, vy = G.moveY / n * spd;
      p.x += vx * dt; p.y += vy * dt;
      if (al <= 0.0001) { p.fdx = G.moveX / n; p.fdy = G.moveY / n; }
    }

    p.x = clamp(p.x, GW_PR, GW_W - GW_PR);
    p.y = clamp(p.y, GW_PR, GW_H - GW_PR);

    for (let i = 0; i < SK_COUNT; i++) if (p.cd[i] > 0) p.cd[i] -= dt;
    if (p.atkCd > 0) p.atkCd -= dt;
    if (p.invul > 0) p.invul -= dt;

    if (G.skillPressed[SK_FIREBALL] && p.cd[SK_FIREBALL] <= 0) { castFireball(); p.cd[SK_FIREBALL] = 2.2; }
    if (G.skillPressed[SK_DASH]     && p.cd[SK_DASH] <= 0)     { castDash(); }
    if (G.skillPressed[SK_FROST]    && p.cd[SK_FROST] <= 0)    { castFrost(); p.cd[SK_FROST] = 6.0; }
    if (G.skillPressed[SK_ROLL]     && p.cd[SK_ROLL] <= 0)     { castRoll(); p.cd[SK_ROLL] = 1.1; }
    G.skillPressed[SK_FIREBALL] = G.skillPressed[SK_DASH]
        = G.skillPressed[SK_FROST] = G.skillPressed[SK_ROLL] = 0;

    // 普攻蓄力：按住蓄力，松开/蓄满释放
    if (p.charging) {
      p.chargeT += 1.9 * dt;
      for (let q = 0; q < 2; q++) {
        const a = rand() * 6.2831853;
        const rad = 32 + rand() * 42;
        addParticle(0, p.x + Math.cos(a) * rad, p.y + Math.sin(a) * rad,
                    -Math.cos(a) * (150 + 90 * p.chargeT),
                    -Math.sin(a) * (150 + 90 * p.chargeT),
                    0.45, 2.4, 3);
      }
      if (p.chargeT >= 1) { p.chargeT = 1; releaseCharge(); }
    }
  }

  /* ------------------------ 怪物更新 ------------------------ */

  function updateMonsters(dt) {
    const p = G.p;
    for (let i = 0; i < MAX_MONSTERS; i++) {
      const m = G.ms[i];
      if (!m.alive) continue;

      if (m.slowT > 0) m.slowT -= dt;
      if (m.hitCd > 0) m.hitCd -= dt;
      if (m.atkCd > 0) m.atkCd -= dt;

      const ddx = p.x - m.x, ddy = p.y - m.y;
      const dd = Math.sqrt(ddx * ddx + ddy * ddy);
      let ux = 0, uy = -1;
      if (dd > 0.001) { ux = ddx / dd; uy = ddy / dd; }

      const spd = m.spd * (m.slowT > 0 ? 0.45 : 1.0);
      m.seed += dt * 6.0;
      const sway = Math.sin(m.seed) * 26;
      m.x += (ux * spd - uy * sway) * dt;
      m.y += (uy * spd + ux * sway) * dt;
      if (Math.abs(ux) > 0.1) m.dir = ux > 0 ? 1 : -1;

      m.x = clamp(m.x, m.r, GW_W - m.r);
      m.y = clamp(m.y, m.r, GW_H - m.r);

      if (p.invul <= 0 && dd < GW_PR + m.r && m.atkCd <= 0) {
        p.hp -= m.dmg;
        m.atkCd = 0.8;
        p.invul = 0.55;
        G.shake = Math.max(G.shake, 4.0);
        addText("-" + Math.floor(m.dmg), p.x, p.y - 44, 1, 20);
        for (let n = 0; n < 6; n++) {
          const a = rand() * 6.2831853;
          addParticle(0, p.x, p.y, Math.cos(a) * 240 + 60, Math.sin(a) * 240 + 60,
                      0.4, 3.5, 1);
        }
        if (p.hp <= 0) {
          p.hp = 0; p.dead = 1;
          G.state = ST_OVER;
          return;
        }
      }
    }
  }

  /* ------------------------ 子弹 / 经验球 / 特效 ------------------------ */

  function updateBullets(dt) {
    for (let i = 0; i < MAX_BULLETS; i++) {
      const b = G.bs[i];
      if (!b.alive) continue;
      b.life -= dt;
      if (b.life <= 0) { b.alive = 0; continue; }
      b.x += b.vx * dt; b.y += b.vy * dt;

      ctx.save();
      for (let k = 3; k >= 0; k--) {
        const kx = b.x - b.vx * 0.02 * k, ky = b.y - b.vy * 0.02 * k;
        ctx.fillStyle = "rgba(255,150,40," + (0.16 * (k + 1)) + ")";
        ctx.beginPath(); ctx.arc(kx, ky, b.r * (1 - k * 0.16), 0, 6.283); ctx.fill();
      }
      // 火球本体
      const grd = ctx.createRadialGradient(b.x - 3, b.y - 3, 2, b.x, b.y, b.r);
      grd.addColorStop(0, "#fff3b0");
      grd.addColorStop(0.5, "#ffb84d");
      grd.addColorStop(1, "#ff6b3d");
      ctx.fillStyle = grd;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 6.283); ctx.fill();
      ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.stroke();
      ctx.restore();
    }
    void p;
  }

  function drawWaves(t) {
    for (let i = 0; i < GW.MAX_WAVES; i++) {
      const w = GW.G().ws[i];
      if (!w.alive) continue;
      const k = w.life / w.maxLife;             // 1→0 随扩散淡出
      const center = Math.atan2(w.dirY, w.dirX);
      const half = w.arc * 0.5;
      const r = w.radius;
      const a0 = center - half, a1 = center + half;
      const punch = w.punch;
      const full = punch >= 0.8;
      const mid = punch >= 0.35;

      // 颜色随蓄力档位：轻=青白，中=白金，满=金橙
      let cOuter, cMid, cCore, cEnd;
      if (full) {
        cOuter = "rgba(255,180,60,"; cMid = "rgba(255,230,120,"; cCore = "rgba(255,255,210,"; cEnd = "rgba(255,160,40,";
      } else if (mid) {
        cOuter = "rgba(255,220,120,"; cMid = "rgba(255,245,200,"; cCore = "rgba(255,255,255,"; cEnd = "rgba(255,200,80,";
      } else {
        cOuter = "rgba(170,225,255,"; cMid = "rgba(220,245,255,"; cCore = "rgba(255,255,255,"; cEnd = "rgba(120,180,220,";
      }

      ctx.save();
      ctx.lineCap = "round";

      // 外层柔光
      ctx.strokeStyle = cOuter + (0.45 * k) + ")";
      ctx.lineWidth = full ? 22 : (mid ? 18 : 16);
      ctx.beginPath(); ctx.arc(w.x, w.y, r, a0, a1); ctx.stroke();

      // 中层
      ctx.strokeStyle = cMid + (0.7 * k) + ")";
      ctx.lineWidth = full ? 10 : (mid ? 8 : 7);
      ctx.beginPath(); ctx.arc(w.x, w.y, r, a0, a1); ctx.stroke();

      // 内层亮线
      ctx.strokeStyle = cCore + (0.95 * k) + ")";
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(w.x, w.y, r, a0, a1); ctx.stroke();

      // 满蓄力：放射光线增强冲击感
      if (full) {
        const rays = 7;
        ctx.strokeStyle = cCore + (0.5 * k) + ")";
        ctx.lineWidth = 3;
        for (let ri = 0; ri < rays; ri++) {
          const ang = a0 + (a1 - a0) * (ri + 0.5) / rays;
          const x1 = w.x + Math.cos(ang) * (r - 14), y1 = w.y + Math.sin(ang) * (r - 14);
          const x2 = w.x + Math.cos(ang) * (r + 14), y2 = w.y + Math.sin(ang) * (r + 14);
          ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
        }
      }

      // 两端"拳头"小圆，增强气波冲击感
      const endR = full ? 9 : (mid ? 7 : 6);
      ctx.fillStyle = cCore + (0.85 * k) + ")";
      ctx.strokeStyle = cEnd + (0.7 * k) + ")";
      ctx.lineWidth = 2;
      const ex0 = w.x + Math.cos(a0) * r, ey0 = w.y + Math.sin(a0) * r;
      const ex1 = w.x + Math.cos(a1) * r, ey1 = w.y + Math.sin(a1) * r;
      ctx.beginPath(); ctx.arc(ex0, ey0, endR, 0, 6.283); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.arc(ex1, ey1, endR, 0, 6.283); ctx.fill(); ctx.stroke();

      ctx.restore();
    }
  }

  function drawChargeEffect(t) {
    const p = GW.G().p;
    if (!p.charging) return;
    const ct = p.chargeT;             // 0→1
    const full = ct >= 0.8;
    const mid = ct >= 0.35;
    const pulse = 0.6 + 0.4 * Math.sin(t * 18);

    let ringC;
    if (full) ringC = "rgba(255,180,40,";
    else if (mid) ringC = "rgba(255,220,80,";
    else ringC = "rgba(180,230,255,";

    ctx.save();

    // 蓄力环
    const ringR = 30 + ct * 14;
    ctx.strokeStyle = ringC + (0.5 + 0.3 * pulse) + ")";
    ctx.lineWidth = 3 + ct * 3;
    ctx.beginPath(); ctx.arc(p.x, p.y, ringR, 0, 6.283); ctx.stroke();

    // 蓄力进度弧（沿朝向方向显示蓄力进度）
    ctx.strokeStyle = ringC + "0.9)";
    ctx.lineWidth = 5;
    const ang = Math.atan2(p.fdy, p.fdx);
    ctx.beginPath(); ctx.arc(p.x, p.y, ringR + 8, ang - 1.2, ang - 1.2 + 2.4 * ct); ctx.stroke();

    // 满蓄闪烁光晕
    if (full) {
      ctx.fillStyle = "rgba(255,240,180," + (0.3 * pulse) + ")";
      ctx.beginPath(); ctx.arc(p.x, p.y, ringR + 16, 0, 6.283); ctx.fill();
    }

    ctx.restore();
  }

  function drawOrbs(t) {
    for (let i = 0; i < GW.MAX_ORBS; i++) {
      const o = GW.G().os[i];
      if (!o.alive) continue;
      const pulse = 1 + Math.sin(t * 7 + o.x) * 0.15;
      ctx.save();
      ctx.translate(o.x, o.y);
      ctx.rotate(t * 3 + o.x * 0.05);
      ctx.fillStyle = "rgba(255,210,63,0.3)";
      ctx.beginPath(); ctx.arc(0, 0, 13 * pulse, 0, 6.283); ctx.fill();
      ctx.fillStyle = GOLD;
      ctx.strokeStyle = "#c98612"; ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(0, -10 * pulse); ctx.lineTo(3, -3); ctx.lineTo(10 * pulse, 0); ctx.lineTo(3, 3); ctx.lineTo(0, 10 * pulse);
      ctx.lineTo(-3, 3); ctx.lineTo(-10 * pulse, 0); ctx.lineTo(-3, -3);
      ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.restore();
    }
  }

  function drawParticles() {
    for (let i = 0; i < GW.MAX_PARTS; i++) {
      const q = GW.G().ps[i];
      if (!q.alive) continue;
      const k = q.life / q.maxLife;
      ctx.save();
      ctx.globalAlpha = Math.max(0, k);
      ctx.fillStyle = DOM_COLORS[q.color] || "#fff";
      ctx.strokeStyle = INK; ctx.lineWidth = 1.5;
      if (q.kind === 1) {                 // 星形
        ctx.translate(q.x, q.y);
        const s = q.size * (0.5 + k * 0.5);
        ctx.beginPath();
        for (let pnt = 0; pnt < 10; pnt++) {
          const ang = pnt * 0.6283;
          const rad = pnt % 2 === 0 ? s : s * 0.45;
          ctx.lineTo(Math.cos(ang) * rad, Math.sin(ang) * rad);
        }
        ctx.closePath(); ctx.fill(); ctx.stroke();
      } else if (q.kind === 2) {          // 火花（沿速度方向）
        ctx.strokeStyle = DOM_COLORS[q.color];
        ctx.lineWidth = q.size;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(q.x, q.y);
        ctx.lineTo(q.x - q.vx * 0.02, q.y - q.vy * 0.02);
        ctx.stroke();
      } else {                             // 圆粒
        ctx.beginPath(); ctx.arc(q.x, q.y, q.size * (0.5 + k * 0.5), 0, 6.283); ctx.fill();
      }
      ctx.restore();
    }
  }

  function drawTexts() {
    for (let i = 0; i < GW.MAX_TEXTS; i++) {
      const tt = GW.G().ts[i];
      if (!tt.alive) continue;
      const k = tt.life / 0.85;
      ctx.save();
      ctx.globalAlpha = Math.min(1, k * 1.8);
      ctx.font = "900 " + tt.size + "px 'Comic Sans MS','Segoe UI',sans-serif";
      ctx.textAlign = "center";
      ctx.lineWidth = 4; ctx.strokeStyle = "rgba(58,48,80," + (0.75 * k) + ")";
      ctx.strokeText(tt.str, tt.x, tt.y);
      ctx.fillStyle = DOM_COLORS[tt.color] || "#fff";
      ctx.fillText(tt.str, tt.x, tt.y);
      ctx.restore();
    }
  }

  /* ============================ HUD ============================ */

  function drawHUD(t) {
    const p = GW.G().p;
    ctx.save();

    // ---- 左上：头像 + 血条 + 经验 + 等级
    const ax = 26, ay = 26;
    ctx.fillStyle = "rgba(255,255,255,0.85)";
    rr(ax - 8, ay - 8, 300, 78, 18); ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 3; rr(ax - 8, ay - 8, 300, 78, 18); ctx.stroke();

    // 头像
    ctx.fillStyle = "#ffefd5";
    ctx.beginPath(); ctx.arc(ax + 26, ay + 30, 23, 0, 6.283); ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = HAT;
    ctx.beginPath(); ctx.arc(ax + 26, ay + 14, 18, Math.PI, 0); ctx.fill();
    ctx.beginPath(); ctx.arc(ax + 26, ay + 14, 18, 0, Math.PI); ctx.fillStyle = "#ff8a7d"; ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(ax + 38, ay + 14, 4.5, 0, 6.283); ctx.fill();
    // 眼睛
    ctx.fillStyle = "#241d33";
    ctx.beginPath(); ctx.arc(ax + 20, ay + 34, 2.4, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.arc(ax + 32, ay + 34, 2.4, 0, 6.283); ctx.fill();

    // 等级徽章
    ctx.fillStyle = GOLD;
    ctx.beginPath(); ctx.arc(ax + 44, ay + 8, 11, 0, 6.283); ctx.fill();
    ctx.strokeStyle = "#c98612"; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.fillStyle = "#7a4a00";
    ctx.font = "900 12px 'Comic Sans MS',sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("Lv." + p.level, ax + 44, ay + 9);

    // 血条
    const hx = ax + 60, hy = ay + 12, hw = 214, hh = 20;
    ctx.fillStyle = "rgba(40,20,30,0.8)";
    rr(hx, hy, hw, hh, 10); ctx.fill();
    const hpK = Math.max(0, p.hp / p.maxHp);
    const hpG = ctx.createLinearGradient(hx, 0, hx + hw, 0);
    hpG.addColorStop(0, "#ff7a8a"); hpG.addColorStop(1, "#ff3d5e");
    ctx.fillStyle = hpG;
    rr(hx + 2, hy + 2, Math.max(3, (hw - 4) * hpK), hh - 4, 8); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.7)"; ctx.lineWidth = 1.5;
    rr(hx + 2, hy + 2, Math.max(3, (hw - 4) * hpK), hh - 4, 8); ctx.stroke();
    ctx.fillStyle = "#fff";
    ctx.font = "700 11px sans-serif";
    ctx.fillText(Math.ceil(p.hp) + " / " + Math.round(p.maxHp), hx + hw / 2, hy + 14);

    // 经验条
    const eyy = hy + hh + 6;
    ctx.fillStyle = "rgba(120,90,10,0.5)";
    rr(hx, eyy, hw, 8, 4); ctx.fill();
    const ek = Math.max(0, p.exp / p.expNext);
    ctx.fillStyle = GOLD;
    rr(hx, eyy, Math.max(2, hw * ek), 8, 4); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.6)"; ctx.lineWidth = 1;
    rr(hx, eyy, hw, 8, 4); ctx.stroke();

    // 属性小字
    ctx.fillStyle = "#6b5b7d";
    ctx.font = "700 11px 'Microsoft YaHei','Segoe UI',sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("攻击 " + Math.round(p.atk) + "   击杀 " + GW.G().kills, hx, eyy + 24);

    // ---- 右上：波次 / 时间
    ctx.textAlign = "right";
    ctx.fillStyle = "rgba(255,255,255,0.85)";
    rr(W - 220, 26, 194, 64, 18); ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 3; rr(W - 220, 26, 194, 64, 18); ctx.stroke();
    ctx.fillStyle = "#4a3a5e";
    ctx.font = "900 20px 'Comic Sans MS','Microsoft YaHei',sans-serif";
    ctx.fillText("第 " + GW.G().wave + " 波", W - 38, 56);
    ctx.font = "700 14px 'Microsoft YaHei',sans-serif";
    ctx.fillText("存活 " + GW.G().aliveMon + " 只  ·  " + fmtTime(GW.G().time), W - 38, 78);

    // ---- 底部中央：技能槽
    const skills = [
      { key: "Q", name: "火球术", cd: p.cd[SK_FIREBALL], max: 2.2, icon: drawIconFire },
      { key: "E", name: "冲刺",   cd: p.cd[SK_DASH],     max: 3.4, icon: drawIconDash },
      { key: "R", name: "冰霜",   cd: p.cd[SK_FROST],    max: 6.0, icon: drawIconFrost },
      { key: "空格", name: "翻滚", cd: p.cd[SK_ROLL],    max: 1.1, icon: drawIconRoll }
    ];
    const bw = 64, bh = 64, gap = 14;
    const baseX = W / 2 - (bw * 4 + gap * 3) / 2;
    const baseY = H - bh - 18;
    for (let i = 0; i < 4; i++) {
      const sx = baseX + i * (bw + gap);
      // 底板
      ctx.fillStyle = "rgba(255,255,255,0.9)";
      rr(sx, baseY, bw, bh, 18); ctx.fill();
      ctx.strokeStyle = INK; ctx.lineWidth = 3; rr(sx, baseY, bw, bh, 18); ctx.stroke();
      // 图标
      ctx.save();
      ctx.beginPath(); rr(sx + 8, baseY + 6, bw - 16, bh - 22, 12); ctx.clip();
      ctx.translate(sx + bw / 2, baseY + bh / 2 - 6);
      skills[i].icon(ctx, t);
      ctx.restore();
      // 冷却遮罩
      const k = Math.max(0, skills[i].cd) / skills[i].max;
      if (k > 0) {
        ctx.fillStyle = "rgba(20,10,30,0.6)";
        ctx.beginPath();
        ctx.moveTo(sx + bw / 2, baseY + bh / 2);
        ctx.arc(sx + bw / 2, baseY + bh / 2, bw * 0.42, -Math.PI / 2, -Math.PI / 2 + k * 6.283);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = "#fff";
        ctx.font = "900 13px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(Math.max(0.1, skills[i].cd).toFixed(1), sx + bw / 2, baseY + bh / 2 + 5);
      }
      // 快捷键角标
      ctx.fillStyle = GOLD;
      ctx.beginPath(); ctx.arc(sx + bw - 14, baseY + 14, 12, 0, 6.283); ctx.fill();
      ctx.strokeStyle = "#c98612"; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = "#7a4a00";
      ctx.font = "900 12px sans-serif";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(skills[i].key, sx + bw - 14, baseY + 15);
      ctx.textBaseline = "alphabetic";
    }

    ctx.restore();
  }

  // 技能图标
  function drawIconFire(c, t) {
    c.fillStyle = "#ff7a30";
    c.beginPath(); c.arc(0, 0, 13, 0, 6.283); c.fill();
    c.strokeStyle = INK; c.lineWidth = 2.5; c.stroke();
    c.fillStyle = "#ffe27a";
    c.beginPath(); c.arc(-2, -2, 6, 0, 6.283); c.fill();
    c.fillStyle = "rgba(255,150,50,0.4)";
    c.beginPath(); c.arc(0, 0, 18 + Math.sin(t * 6) * 2, 0, 6.283); c.fill();
  }
  function drawIconDash(c) {
    c.strokeStyle = CLOAK; c.lineWidth = 5; c.lineCap = "round";
    c.beginPath(); c.moveTo(-10, 0); c.lineTo(10, 0); c.stroke();
    c.fillStyle = CLOAK;
    c.beginPath(); c.moveTo(10, 0); c.lineTo(2, -6); c.lineTo(5, 0); c.lineTo(2, 6); c.closePath(); c.fill();
    c.fillStyle = "#ffd9a0";
    c.beginPath(); c.arc(-4, 0, 6, 0, 6.283); c.fill();
  }
  function drawIconFrost(c) {
    c.strokeStyle = "#6fd8ff";
    c.lineWidth = 4; c.lineCap = "round";
    for (let i = 0; i < 6; i++) {
      const a = i * 1.047;
      c.beginPath();
      c.moveTo(Math.cos(a) * 3, Math.sin(a) * 3);
      c.lineTo(Math.cos(a) * 13, Math.sin(a) * 13);
      c.stroke();
    }
    c.fillStyle = "#bff0ff";
    c.beginPath(); c.arc(0, 0, 5, 0, 6.283); c.fill();
  }
  function drawIconRoll(c) {
    c.strokeStyle = "#8a6bff";
    c.lineWidth = 5;
    c.beginPath(); c.ellipse(0, 0, 12, 7, 0.5, 0, 6.283); c.stroke();
    c.strokeStyle = "#b39cff";
    c.lineWidth = 2.5;
    c.beginPath(); c.ellipse(0, 0, 7, 4, 0.5, 0, 6.283); c.stroke();
  }

  function fmtTime(sec) {
    const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
    return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
  }

  /* ============================ 中央提示 ============================ */

  function drawBanner() {
    const gg = GW.G();
    if (gg.msgT <= 0 || !gg.msg) return;
    const k = gg.msgT / 2;
    ctx.save();
    ctx.globalAlpha = Math.min(1, k * 2.5);
    ctx.font = "900 52px 'Comic Sans MS','Microsoft YaHei',sans-serif";
    ctx.textAlign = "center";
    ctx.lineWidth = 10; ctx.strokeStyle = "rgba(58,48,80,0.85)";
    ctx.strokeText(gg.msg, W / 2, H * 0.32);
    ctx.fillStyle = "#ffffff";
    ctx.fillText(gg.msg, W / 2, H * 0.32);
    ctx.restore();
  }

  /* ============================ 主渲染 ============================ */

  function render(t, uiMode) {
    ctx.save();
    // 屏幕震动
    const gg = GW.G();
    if (gg.shake > 0.2) {
      ctx.translate((Math.random() - 0.5) * gg.shake, (Math.random() - 0.5) * gg.shake);
    }
    drawBackground(t);

    if (uiMode === "menu") {
      drawMenu(t);
      ctx.restore();
      return;
    }
    if (uiMode === "over" || gg.state === ST_OVER) {
      ctx.restore();
      drawOver();
      return;
    }

    // 竞技场地面特效已在 drawBackground 中绘制

    // 经验球 -> 怪物 -> 子弹 -> 玩家 -> 气波 -> 粒子 -> 文字
    drawOrbs(t);
    for (let i = 0; i < GW.MAX_MONSTERS; i++) drawMonster(gg.ms[i], t);
    drawBullets();
    drawPlayer(t);
    drawChargeEffect(t);
    drawWaves(t);
    drawParticles();
    drawTexts();

    ctx.restore();

    drawHUD(t);
    drawBanner();
  }

  /* ============================ 菜单 / 结算 ============================ */

  function drawMenu(t) {
    ctx.save();
    ctx.fillStyle = "rgba(255,238,214,0.55)";
    ctx.fillRect(0, 0, W, H);
    ctx.restore();

    // 标题太阳与云由背景提供
    ctx.textAlign = "center";
    ctx.font = "900 96px 'Comic Sans MS','Microsoft YaHei',sans-serif";
    ctx.lineWidth = 18; ctx.strokeStyle = "rgba(58,48,80,0.9)";
    ctx.strokeText("勇敢的小勇者", W / 2, H * 0.3);
    ctx.fillStyle = "#ffffff";
    ctx.fillText("勇敢的小勇者", W / 2, H * 0.3);
    ctx.fillStyle = "#ffd23f";
    ctx.font = "900 26px 'Microsoft YaHei',sans-serif";
    ctx.fillText("☆ 打怪升级 · 卡通冒险 ☆", W / 2, H * 0.3 + 52);

    // 主角萌像
    const p0 = { x: W / 2, y: H * 0.56, fdx: 1, fdy: 0.3, rollT: 0 };
    const saveP = GW.G().p;
    GW.G().p = p0;
    drawPlayer(t);
    GW.G().p = saveP;

    // 开始按钮
    btnInfo = { x: W / 2 - 140, y: H * 0.78, w: 280, h: 66 };
    ctx.fillStyle = "#ffd23f";
    rr(btnInfo.x, btnInfo.y, btnInfo.w, btnInfo.h, 33); ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 5; rr(btnInfo.x, btnInfo.y, btnInfo.w, btnInfo.h, 33); ctx.stroke();
    ctx.fillStyle = "#7a4a00";
    ctx.font = "900 34px 'Microsoft YaHei',sans-serif";
    ctx.fillText("▶ 开始冒险", W / 2, btnInfo.y + 45);

    // 操作说明
    ctx.font = "700 17px 'Microsoft YaHei',sans-serif";
    ctx.fillStyle = "rgba(74,58,94,0.95)";
    ctx.fillText("WASD / 方向键 移动 · 鼠标瞄准 · 按住左键蓄力，松开释放冲击波 · Q 火球 · E 冲刺 · R 冰霜 · 空格键 翻滚", W / 2, H * 0.9);
  }

  function drawOver() {
    const gg = GW.G();
    ctx.save();
    ctx.fillStyle = "rgba(30,20,45,0.72)";
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = "center";
    ctx.font = "900 72px 'Comic Sans MS','Microsoft YaHei',sans-serif";
    ctx.lineWidth = 12; ctx.strokeStyle = "rgba(58,48,80,0.95)";
    ctx.strokeText("哎呀！被打败啦", W / 2, H * 0.3);
    ctx.fillStyle = "#ffd23f";
    ctx.fillText("哎呀！被打败啦", W / 2, H * 0.3);

    ctx.fillStyle = "#fff";
    ctx.font = "900 30px 'Microsoft YaHei',sans-serif";
    ctx.fillText("达到 第 " + gg.wave + " 波   ·   击杀 " + gg.kills + " 只   ·   等级 " + gg.p.level + "   ·   用时 " + fmtTime(gg.time), W / 2, H * 0.42);

    btnInfo = { x: W / 2 - 140, y: H * 0.56, w: 280, h: 66 };
    ctx.fillStyle = "#ffd23f";
    rr(btnInfo.x, btnInfo.y, btnInfo.w, btnInfo.h, 33); ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 5; rr(btnInfo.x, btnInfo.y, btnInfo.w, btnInfo.h, 33); ctx.stroke();
    ctx.fillStyle = "#7a4a00";
    ctx.font = "900 34px 'Microsoft YaHei',sans-serif";
    ctx.fillText("再战一次", W / 2, btnInfo.y + 45);

    ctx.font = "700 18px 'Microsoft YaHei',sans-serif";
    ctx.fillStyle = "#cdb8e6";
    ctx.fillText("试试用 E 冲刺躲开包围，再用冰霜冻住一群怪！", W / 2, H * 0.72);
    ctx.restore();
  }

  /* 菜单/结算按钮区域，供 main.js 进行点击判定 */
  let btnInfo = null;
  function getButton() { return btnInfo; }

  /* ============================ 初始化 ============================ */

  function init(cv) {
    canvas = cv;
    ctx = canvas.getContext("2d");
    resize();
    window.addEventListener("resize", resize);
  }

  function resize() {
    const cw = window.innerWidth, ch = window.innerHeight;
    scale = Math.min(cw / W, ch / H);
    // 让画面占满（不留黑边）
    scale = Math.max(scale, 0.001);
    const w = W * scale, h = H * scale;
    canvas.width = w * window.devicePixelRatio;
    canvas.height = h * window.devicePixelRatio;
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
    ctx.setTransform(window.devicePixelRatio * scale, 0, 0, window.devicePixelRatio * scale, 0, 0);
  }

  // 将屏幕坐标转为逻辑坐标（供点击判定）
  function toLogical(sx, sy) {
    const rect = canvas.getBoundingClientRect();
    return { x: (sx - rect.left) / scale, y: (sy - rect.top) / scale };
  }
  function toScreen(lx, ly) {
    const rect = canvas.getBoundingClientRect();
    return { x: rect.left + lx * scale, y: rect.top + ly * scale };
  }

  return { init, render, resize, getButton, toLogical, toScreen };
})();
  </script>
  <script>
/* ============================================================================
 *  main.js —— 主控制器：输入监听、游戏循环、界面状态切换
 * ==========================================================================*/

"use strict";

(function () {

  const canvas = document.getElementById("game");
  if (!canvas) return;

  Renderer.init(canvas);
  GW.gStart();                    // 初始化一局（世界静止，等待玩家点击开始）

  let menuMode = true;            // true：主菜单（引擎不推进）
  let last = performance.now();
  let t = 0;                      // 渲染时钟

  /* ---------------- 输入状态 ---------------- */

  let keys = {};

  function keyName(e) {
    const k = e.key.toLowerCase();
    if (k === "arrowup") return "up";
    if (k === "arrowdown") return "down";
    if (k === "arrowleft") return "left";
    if (k === "arrowright") return "right";
    return k;
  }

  window.addEventListener("keydown", (e) => {
    const n = keyName(e);
    if (["up", "down", "left", "right", " "].indexOf(n) >= 0) e.preventDefault();
    if (e.repeat) return;
    keys[n] = true;

    if (menuMode) return;
    if (n === "q") GW.gPress(GW.PRESS_FIREBALL);
    else if (n === "e") GW.gPress(GW.PRESS_DASH);
    else if (n === "r") GW.gPress(GW.PRESS_FROST);
    else if (n === " ") GW.gPress(GW.PRESS_ROLL);
  });

  window.addEventListener("keyup", (e) => {
    keys[keyName(e)] = false;
  });

  window.addEventListener("mousemove", (e) => {
    const p = GW.G().p;
    const lp = Renderer.toLogical(e.clientX, e.clientY);
    GW.gSetAim(lp.x - p.x, lp.y - p.y);
  });

  canvas.addEventListener("mousedown", (e) => {
    if (e.button !== 0) return;
    const lp = Renderer.toLogical(e.clientX, e.clientY);

    if (menuMode) {
      const btn = Renderer.getButton();
      if (btn && inRect(lp, btn)) startGame();
      return;
    }
    if (GW.G().state === GW.ST_OVER) {
      const btn = Renderer.getButton();
      if (btn && inRect(lp, btn)) startGame();
      return;
    }
    GW.gPress(GW.PRESS_ATK);
  });

  window.addEventListener("mouseup", (e) => {
    if (e.button !== 0) return;
    if (menuMode) return;
    if (GW.G().state !== GW.ST_PLAY) return;
    GW.gRelease(GW.PRESS_ATK);
  });

  window.addEventListener("blur", () => {
    if (menuMode) return;
    if (GW.G().state !== GW.ST_PLAY) return;
    GW.gRelease(GW.PRESS_ATK);
  });

  canvas.addEventListener("contextmenu", (e) => e.preventDefault());

  function inRect(p, r) {
    return p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;
  }

  function startGame() {
    GW.gStart();
    menuMode = false;
    // 先给一次朝向输入
    GW.gSetAim(0, -1);
  }

  /* ---------------- 移动输入合并 ---------------- */

  function updateMove() {
    let x = 0, y = 0;
    if (keys.w || keys.up) y -= 1;
    if (keys.s || keys.down) y += 1;
    if (keys.a || keys.left) x -= 1;
    if (keys.d || keys.right) x += 1;
    GW.gSetMove(x, y);
  }

  /* ---------------- 主循环 ---------------- */

  function frame(now) {
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.05) dt = 0.05;
    t += dt;

    if (menuMode) {
      Renderer.render(t, "menu");
    } else if (GW.G().state === GW.ST_OVER) {
      Renderer.render(t, "over");
    } else {
      updateMove();
      GW.gStep(dt);
      Renderer.render(t, "play");
    }

    // 死亡后鼠标也用于瞄准，循环继续
    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
  </script>
