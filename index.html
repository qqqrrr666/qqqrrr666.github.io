<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>竹知了 · 3D 仿真</title>
<style>
  :root{--accent:#7adfa6;--accent2:#f4d35e;--danger:#e76f51;--panel:rgba(8,20,17,.72);--line:rgba(122,223,166,.25);--txt:#eaf6ef;--dim:#9fb8ad;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:linear-gradient(180deg,#5b9bd5 0%,#9fc9b8 45%,#d9c89a 75%,#6b8e4a 100%);color:var(--txt);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;touch-action:none;user-select:none}
  #app{position:fixed;inset:0}#scene{position:absolute;inset:0;display:block;width:100%;height:100%}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 6px 24px rgba(0,0,0,.35)}
  #top{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:10px;align-items:flex-start;pointer-events:none}
  #title{padding:10px 14px;pointer-events:auto;max-width:62vw}
  #title h1{margin:0;font-size:18px;letter-spacing:2px;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
  #title p{margin:3px 0 0;font-size:11px;color:var(--dim);line-height:1.5}
  #score{margin-left:auto;padding:10px 14px;pointer-events:auto;text-align:right;min-width:150px}
  #score .big{font-size:22px;font-weight:700;color:var(--accent2)}#score .row{font-size:11px;color:var(--dim);margin-top:2px}#score .row b{color:var(--txt)}
  #gauges{position:absolute;left:12px;bottom:96px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
  .gauge{padding:8px 12px;min-width:180px}.gauge .lbl{font-size:10px;color:var(--dim);display:flex;justify-content:space-between}.gauge .lbl b{color:var(--accent)}
  .bar{height:7px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:4px}.bar > i{display:block;height:100%;width:0%;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--accent2),var(--danger));transition:width .08s linear}
  #bottom{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding:0 12px}
  .btn{pointer-events:auto;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--txt);border-radius:12px;padding:11px 16px;font-size:13px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:.15s;display:inline-flex;align-items:center;gap:7px}
  .btn:active{transform:scale(.95);background:rgba(122,223,166,.18)}.btn.on{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .btn .dot{width:8px;height:8px;border-radius:50%;background:var(--dim)}.btn.on .dot{background:var(--accent);box-shadow:0 0 8px var(--accent)}
  #modes{position:absolute;top:78px;left:12px;display:flex;flex-direction:column;gap:6px}
  .mode{pointer-events:auto;cursor:pointer;font-size:12px;padding:7px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--dim)}.mode.on{color:var(--accent2);border-color:var(--accent2)}
  #camWrap{position:absolute;right:12px;bottom:96px;width:150px;height:112px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#000;display:none}#camWrap.show{display:block}
  #camVideo{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}#camWrap canvas{position:absolute;inset:0;width:100%;height:100%;transform:scaleX(-1)}
  #toast{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%);padding:14px 22px;border-radius:14px;font-size:14px;text-align:center;opacity:0;transition:.3s;pointer-events:none;max-width:80vw}#toast.show{opacity:1}
  #intro{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:rgba(5,12,10,.55);backdrop-filter:blur(4px);z-index:5}
  #intro .card{padding:22px 26px;max-width:460px;text-align:center}#intro h2{margin:0 0 8px;font-size:20px;color:var(--accent)}#intro p{margin:0 0 10px;font-size:13px;color:var(--dim);line-height:1.7}#intro .start{font-size:15px;padding:12px 28px;border-color:var(--accent);color:var(--accent)}#intro .tip{font-size:11px;color:var(--dim)}
  #engTag{position:absolute;top:78px;right:12px;font-size:10px;color:var(--dim);padding:4px 8px;border-radius:8px;border:1px solid var(--line)}
  @media (max-width:640px){#title h1{font-size:15px}#title p{font-size:10px}#score{min-width:120px}#score .big{font-size:18px}.btn{padding:10px 12px;font-size:12px}#gauges{left:8px;bottom:88px}.gauge{min-width:150px}#camWrap{width:110px;height:84px;bottom:88px}#modes{top:70px;left:8px}#engTag{top:70px;right:8px}}
</style>
</head>
<body>
<div id="app">
  <canvas id="scene"></canvas>
  <div id="top">
    <div id="title" class="panel"><h1>竹 知 了</h1><p>甩动木棒 · 蝉翅切割空气 · 振动如蝉鸣</p></div>
    <div id="score" class="panel"><div class="big" id="scoreVal">0</div><div class="row">当前：<b id="curLabel">待启动</b></div><div class="row">最好：<b id="bestVal">0</b></div></div>
  </div>
  <div id="modes"><div class="mode on" data-mode="endurance">蝉鸣持久战</div><div class="mode" data-mode="peak">极限转速</div></div>
  <div id="engTag" class="panel">引擎加载中</div>
  <div id="gauges">
    <div class="gauge panel"><div class="lbl"><span>转速</span><b id="rpmVal">0 转/秒</b></div><div class="bar"><i id="rpmBar"></i></div></div>
    <div class="gauge panel"><div class="lbl"><span>响度</span><b id="volVal">0%</b></div><div class="bar"><i id="volBar"></i></div></div>
  </div>
  <div id="camWrap"><video id="camVideo" playsinline muted></video><canvas id="camOverlay"></canvas></div>
  <div id="bottom">
    <div class="btn" id="btnCam"><span class="dot"></span>摄像头手势</div>
    <div class="btn" id="btnView"><span class="dot"></span>视角旋转</div>
    <div class="btn" id="btnSpin"><span class="dot"></span>甩一下</div>
    <div class="btn" id="btnReset">重置</div>
  </div>
  <div id="toast" class="panel"></div>
  <div id="intro">
    <div class="card panel">
      <h2>竹 知 了 · 3D 仿真</h2>
      <p>中国传统竹木玩具。一根木棒用红绳系着一只竹蝉：原木色圆身、两片黑色镂空蝉翅、红色头与触角。手握木棒甩动，蝉在绳端高速旋转，蝉翅切割空气振动，发出「哇呜——哇呜——」的蝉鸣声。转得越快越响越尖，慢下来变闷变低。</p>
      <p style="color:var(--accent)">拖拽画面来回甩 · 双指/右键旋转视角 · 摇一摇 · 摄像头手势</p>
      <div class="btn start" id="btnStart">开始游玩</div>
      <div class="tip">联网加载 3D 引擎；若离线自动降级为内置 2.5D 渲染，同样可玩</div>
    </div>
  </div>
</div>
<script src="https://unpkg.com/three@0.149.0/build/three.min.js" onerror="window.__threeFail=true"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js" crossorigin="anonymous" onerror="window.__camFail=true"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous" onerror="window.__handsFail=true"></script>
<script>
(function(){

      for(var k=0;k<5;k++){var lf=new THREE.Mesh(new THREE.PlaneGeometry(0.55,0.16),lm);lf.position.set(pos[i][0]+(Math.random()-.5)*0.6,h-1.2+Math.random(),pos[i][1]+(Math.random()-.5)*0.6);lf.rotation.set(Math.random()*0.6,Math.random()*Math.PI,Math.random()*0.6);scene.add(lf);}}})();

  var LEAF_N=48;
