/* ==========================================================================
   Design Token —— 全站唯一的样式真相来源。
   组件里不允许出现裸色值、裸字号；一切引用变量。
   视觉方向：档案纸、墨线、朱砂落印、数字为本。
   配色比例：约 70% 纸色 / 20% 墨色 / 5% 朱砂 / 5% 其他强调。
   ========================================================================== */
:root {
  /* ---- 墨（主色）---- */
  --ink: #1a1c1e;
  --ink-2: #4a4e52;
  --ink-3: #8a8e92; /* 对比度约 3:1，仅可用于装饰或 ≥18px 大字 */
  --line: rgba(26, 28, 30, 0.14);
  --line-strong: rgba(26, 28, 30, 0.28);

  /* ---- 朱砂（强调）---- */
  --seal: #a02a22;
  --seal-deep: #7a1e18;
  --seal-soft: rgba(160, 42, 34, 0.08);

  /* ---- 其他强调（预留：数据面板的海拔剖面与四支部队对照，P3 启用）---- */
  --indigo: #33566b;

  /* ---- 纸（背景，三层，不出现第四层）---- */
  --paper: #f4f1ea;
  --paper-deep: #eae5da;
  --paper-light: #faf8f4;
  --map-plate: #efece4;

  /* ---- 字体 ---- */
  --font-display: "Source Han Serif SC", "Noto Serif CJK SC", "Songti SC", SimSun, serif;
  --font-body: "Source Han Sans SC", "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num: "Helvetica Neue", Helvetica, Arial, sans-serif;

  /* ---- 字号层级 ---- */
  --fs-display: clamp(2.5rem, 5.4vw, 5rem); /* 主标题 40 → 80px */
  --fs-h1: clamp(1.75rem, 2.8vw, 2.5rem);
  --fs-h2: 1.75rem;
  --fs-h3: 1.25rem;
  --fs-body: 1.0625rem; /* 17px */
  --fs-body-s: 0.9375rem; /* 15px */
  --fs-caption: 0.8125rem; /* 13px */
  --fs-label: 0.75rem; /* 12px */

  /* ---- 间距 ---- */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 24px;
  --sp-6: 32px;
  --sp-7: 48px;
  --sp-8: 64px;
  --sp-9: 96px;

  /* ---- 结构与节奏 ---- */
  --header-h: 72px;
  --container-max: 1680px;
  --container-pad: clamp(24px, 4.5vw, 96px);
  --radius: 2px; /* 全站只有一种圆角；全站零阴影：层次只靠边框与底色差 */
  --dur-fast: 120ms;
  --dur-base: 200ms;
  --ease: cubic-bezier(0.2, 0.6, 0.2, 1);
  --focus-ring: 2px solid var(--seal);
}

/* 首页专有样式：只服务于首页的信息层级，不污染其他页面 */

/* 入场节奏：只有“一次”的、900ms 内的编排。
